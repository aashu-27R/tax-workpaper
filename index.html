<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Okafor-Lindqvist Workpaper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky top bar · section nav · working canvas · trace panel that slides in from the right */
:root {
  --bg: #f4f6f4; --surface: #ffffff; --sunk: #eef1ee; --ink: #16201b; --muted: #5b6a62; --line: #d8dfda; --line-2: #c6cfc9;
  --accent: #1d6a55; --accent-ink: #ffffff; --accent-soft: #e2efe9; --paper: #fffdf9; --paper-ink: #24221e; --mark: #fff0b3; --mark-focus: #ffd34d;
  --good: #2b7a4b; --good-soft: #e3f2e8; --warn: #9a6208; --warn-soft: #fbf0dc; --bad: #b0281f; --bad-soft: #fbe6e3; --info: #2b5a97; --info-soft: #e5edf8;
  --f-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif; --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; --f-doc: "Source Serif 4", Georgia, "Times New Roman", serif;
  --r: 6px; --shadow: 0 1px 2px rgba(20,30,25,.06), 0 4px 16px rgba(20,30,25,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1412; --surface: #161c19; --sunk: #121815; --ink: #e4ebe7; --muted: #95a49c; --line: #27302c; --line-2: #34403a;
  --accent: #5cb595; --accent-ink: #0b1210; --accent-soft: #1b3229; --paper: #1d2320; --paper-ink: #e6e2d8; --mark: #4a4020; --mark-focus: #7a6420;
  --good: #6cc48f; --good-soft: #1b3324; --warn: #e0a64a; --warn-soft: #3a2c14; --bad: #ef7d73; --bad-soft: #3d1c19; --info: #86aee6; --info-soft: #1b2738; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #161c19; --sunk: #121815; --ink: #e4ebe7; --muted: #95a49c; --line: #27302c; --line-2: #34403a;
  --accent: #5cb595; --accent-ink: #0b1210; --accent-soft: #1b3229; --paper: #1d2320; --paper-ink: #e6e2d8; --mark: #4a4020; --mark-focus: #7a6420;
  --good: #6cc48f; --good-soft: #1b3324; --warn: #e0a64a; --warn-soft: #3a2c14; --bad: #ef7d73; --bad-soft: #3d1c19; --info: #86aee6; --info-soft: #1b2738; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); }
* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .5rem; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; margin: 0; text-wrap: balance; }
h3 { font-size: 1rem; margin: 0; }

p { margin: 0 0 .6rem; }

code { font-size: .85em; }
.key { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.num { font-size: .92em; }
.muted { color: var(--muted); } .small { font-size: .82rem; } .strong { font-weight: 600; } .good { color: var(--good); } .bad { color: var(--bad); } .warnc { color: var(--warn); }
.strike { text-decoration: line-through; color: var(--muted); }
.neg { }
.grow { flex: 1; } .minw0 { min-width: 0; }
.row { display: flex; align-items: center; } .gap { gap: .5rem; } .wrap { flex-wrap: wrap; }

/* shell */
.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); grid-template-rows: auto auto auto 1fr; min-height: 100%; }
.shell.with-insp { grid-template-columns: 216px minmax(0, 1fr) minmax(360px, 520px); }
.top { grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; padding-block: .55rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .5rem; white-space: nowrap; }
.mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-family: var(--f-doc); }
.client { font-weight: 600; padding-left: .8rem; border-left: 1px solid var(--line); white-space: nowrap; }
.top label.clock, .top label.persona { display: flex; flex-direction: row; align-items: center; gap: .35rem; }
.clock .k, .persona .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.top select, .top input[type=date] { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r); padding: .3rem .4rem; max-width: 15rem; }
.presence { display: flex; align-items: center; gap: .3rem; margin-left: auto; }
.peer { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--info-soft); color: var(--info); font-weight: 700; font-size: .75rem; }
.store { color: var(--warn); font-size: .8rem; } .store-on { color: var(--good); }
.hamb { display: none; background: none; border: 1px solid var(--line); border-radius: var(--r); padding: .2rem .5rem; }
.search { position: relative; flex: 1; min-width: 12rem; max-width: 26rem; }

.sres button:hover { background: var(--accent-soft); }
.banner { grid-column: 1 / -1; padding: .45rem max(16px, env(safe-area-inset-left, 0px)); font-size: .85rem; }
.banner-warn { background: var(--warn-soft); color: var(--warn); } .banner-info { background: var(--info-soft); color: var(--info); border-radius: var(--r); padding: .5rem .8rem; margin-bottom: 1rem; }
.nav { grid-row: 4; padding: .8rem .6rem 2rem max(10px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--sunk); position: sticky; top: 52px; align-self: start; max-height: calc(100vh - 52px); overflow: auto; }
.navg { margin-bottom: .9rem; }
.navh { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding: 0 .5rem .25rem; font-weight: 600; }
.navi { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: .32rem .5rem; border-radius: var(--r); cursor: pointer; }
.navi:hover { background: var(--surface); } .navi.cur { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.navi-sm { font-size: .85rem; padding: .2rem .5rem; }
.badge { font-family: var(--f-num); font-size: .72rem; background: var(--bad-soft); color: var(--bad); border-radius: 9px; padding: 0 .4rem; }
.navfoot { padding: .5rem; line-height: 1.4; }
.main { grid-row: 4; min-width: 0; padding-block: 1.4rem 4rem; padding-left: max(16px, 1.6rem); padding-right: max(16px, 1.6rem); }
.view { max-width: 1180px; } .narrow { max-width: 760px; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 600; margin-bottom: .25rem; }

/* sections & tables */
.sec { margin: 1.4rem 0; }
.sec-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: .6rem; }
.sub { color: var(--muted); font-size: .84rem; margin: .15rem 0 0; max-width: 70ch; }
.tw { overflow-x: auto; margin-bottom: .8rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.t { width: 100%; border-collapse: collapse; font-size: .88rem; }
.t caption { text-align: left; font-weight: 600; padding: .55rem .7rem; font-size: .85rem; border-bottom: 1px solid var(--line); }
.t th { text-align: left; font-weight: 600; font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: .45rem .6rem; border-bottom: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
.t td { padding: .42rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; white-space: nowrap; }
.t-tight td { padding: .3rem .55rem; }
.t tr.tot td { font-weight: 600; background: var(--sunk); }
.t tr.click { cursor: pointer; } .t tr.click:hover td { background: var(--accent-soft); }
.row-adj td { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.row-flag td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.sev-error td:first-child { box-shadow: inset 3px 0 0 var(--bad); } .sev-warning td:first-child { box-shadow: inset 3px 0 0 var(--warn); } .sev-info td:first-child { box-shadow: inset 3px 0 0 var(--info); }
.lines td.ev { white-space: nowrap; }
.lots td.small { white-space: nowrap; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 70ch; }
.sumt td:first-child { min-width: 11rem; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: .3rem; border: 1px solid var(--line-2); background: var(--surface); padding: .38rem .75rem; border-radius: var(--r); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn-danger { color: var(--bad); border-color: var(--bad); }
.btn-sm { padding: .2rem .5rem; font-size: .82rem; }
.in { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r); padding: .35rem .5rem; min-width: 0; }
textarea.in { width: 100%; resize: vertical; }
.mono { font-family: var(--f-num); font-size: .8rem; }
select { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r); padding: .3rem .4rem; }
label { display: flex; flex-direction: column; gap: .2rem; font-size: .84rem; color: var(--muted); }
label.chk { flex-direction: row; align-items: center; gap: .4rem; color: var(--ink); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.toolbar { display: flex; align-items: center; gap: .5rem; margin: .8rem 0; flex-wrap: wrap; }
.tab { background: none; border: 1px solid var(--line); border-radius: 20px; padding: .25rem .7rem; cursor: pointer; font-size: .85rem; }
.tab.cur { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-flex; align-items: center; font-size: .72rem; font-weight: 600; padding: .05rem .45rem; border-radius: 4px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; vertical-align: middle; margin-right: .2rem; }
.pill-good { background: var(--good-soft); color: var(--good); border-color: transparent; } .pill-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; } .pill-info { background: var(--info-soft); color: var(--info); border-color: transparent; } .pill-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.ref { font-family: var(--f-num); font-size: .78rem; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 0 .35rem; cursor: pointer; color: var(--ink); margin: 0 .15rem .15rem 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.ref:hover { border-color: var(--accent); color: var(--accent); }
.ref-ev { background: var(--mark); border-color: transparent; }
.ref.plain { font-family: var(--f-ui); font-size: inherit; background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline dotted var(--line-2); text-underline-offset: 3px; }
.ref.plain:hover { color: var(--accent); } .ref-line { background: var(--accent-soft); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: .2rem; }
.chip { display: inline-flex; gap: .3rem; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: .05rem .4rem; font-size: .8rem; background: var(--surface); }
.who { white-space: nowrap; font-weight: 500; } .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: .3rem; vertical-align: middle; background: var(--muted); }
.dot-preparer { background: var(--info); } .dot-reviewer { background: var(--warn); } .dot-partner { background: var(--accent); } .dot-client { background: var(--good); } .dot-quality_reviewer { background: var(--bad); }
.when { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.tick { font-family: var(--f-num); font-size: .7rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 .2rem; margin-right: .15rem; }
.bar { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; min-width: 50px; }
.bar-fill { height: 100%; } .bar-accent { background: var(--accent); } .bar-bad { background: var(--bad); }
.empty { padding: 1.2rem; border: 1px dashed var(--line-2); border-radius: var(--r); color: var(--muted); text-align: center; }

/* overview */
.hero { display: flex; justify-content: space-between; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
.hero > div:first-child { max-width: 62ch; }
.hero-nums { display: flex; gap: .8rem; flex-wrap: wrap; }
.hn { display: flex; flex-direction: column; padding: .7rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 11rem; }
.hn .k, .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.big { font-size: 1.5rem; font-weight: 500; letter-spacing: -.01em; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 1rem; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .5rem; margin: .8rem 0; }
.stat { display: flex; flex-direction: column; gap: .1rem; text-align: left; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-size: .82rem; color: var(--muted); }
button.stat { cursor: pointer; } button.stat:hover { border-color: var(--accent); }
.stat .big { color: var(--ink); font-size: 1.35rem; }
.todo { margin: 0 0 .5rem; padding-left: 1.1rem; } .todo li { margin: .2rem 0; color: var(--bad); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: .4rem; }
.steps li { display: flex; gap: .6rem; align-items: center; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.steps li > div { flex: 1; min-width: 0; }
.stp { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: inline-grid; place-items: center; border: 1.5px solid var(--line-2); color: var(--muted); flex: none; font-size: .8rem; }
.steps li.ok .stp { background: var(--good); border-color: var(--good); color: var(--surface); }
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: .5rem; }
.acard { display: flex; flex-direction: column; gap: .35rem; text-align: left; padding: .7rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; }
.acard:hover { border-color: var(--accent); }
.acard-h { display: flex; justify-content: space-between; gap: .4rem; align-items: flex-start; }
.sos { display: flex; gap: 2px; flex: none; }
.so { min-width: 20px; padding: 0 2px; height: 20px; border-radius: 4px; display: inline-grid; place-items: center; font-size: .68rem; font-weight: 700; font-family: var(--f-num); }
.so-none { border: 1px dashed var(--line-2); color: var(--muted); } .so-ok { background: var(--good); color: var(--surface); } .so-stale { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
.signs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .5rem; }
.sign { padding: .7rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); display: flex; flex-direction: column; gap: .3rem; align-items: flex-start; }
.sign-ok { border-color: var(--good); } .sign-stale { border-color: var(--warn); background: var(--warn-soft); }
.split { display: flex; gap: 1rem; align-items: flex-start; }
.formnav { display: flex; flex-direction: column; min-width: 190px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-height: 70vh; overflow: auto; }
.fn { display: flex; justify-content: space-between; gap: .5rem; background: none; border: 0; border-bottom: 1px solid var(--line); padding: .35rem .6rem; text-align: left; cursor: pointer; font-size: .86rem; }
.fn.cur { background: var(--accent-soft); font-weight: 600; }
.pager { display: flex; gap: .4rem; align-items: center; }

/* inspector */
.insp { grid-row: 4; grid-column: 3; border-left: 1px solid var(--line); background: var(--surface); position: sticky; top: 52px; align-self: start; height: calc(100vh - 52px); display: flex; flex-direction: column; min-width: 0; }
.insp-top { display: flex; align-items: center; gap: .3rem; padding: .45rem .7rem; border-bottom: 1px solid var(--line); background: var(--sunk); }
.crumbs { display: flex; gap: .2rem; overflow-x: auto; flex: 1; }
.crumb { background: none; border: 0; font-family: var(--f-num); font-size: .76rem; color: var(--muted); cursor: pointer; white-space: nowrap; padding: .1rem .2rem; }
.crumb:not(:last-child)::after { content: ' ›'; } .crumb.cur { color: var(--ink); font-weight: 600; }
.x { background: none; border: 0; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 .3rem; }
.insp-body { overflow: auto; padding: 1rem 1rem 3rem; flex: 1; }
.panel .ph { margin: .3rem 0 .6rem; font-size: 1.12rem; }
.ph-row { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; }
.valrow { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .5rem; } .arrow { color: var(--muted); }
.kv { display: grid; gap: .3rem; margin: .6rem 0 .9rem; font-size: .86rem; }
.kv > div { display: grid; grid-template-columns: 6.5rem 1fr; gap: .6rem; } .kv .k { padding-top: .15rem; }
.hist { display: flex; gap: .8rem; flex-wrap: wrap; }
.var { font-family: var(--f-num); font-size: .82rem; color: var(--muted); } .var-flag { color: var(--warn); font-weight: 600; }
.blk { margin: 1rem 0; } .note { font-size: .85rem; color: var(--muted); border-left: 2px solid var(--line-2); padding-left: .6rem; }
.lead { font-size: .95rem; max-width: 65ch; }
.srcs { list-style: none; padding: 0; margin: 0; } .src { padding: .25rem 0; border-bottom: 1px dashed var(--line); font-size: .86rem; }
.fchip { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; width: 100%; text-align: left; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r); padding: .4rem .5rem; margin-bottom: .3rem; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; padding-top: .7rem; border-top: 1px solid var(--line); }
.aform { display: flex; flex-direction: column; gap: .55rem; padding: .8rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); margin-top: .5rem; }
.log { list-style: none; padding: 0; margin: 0; } .log li { padding: .3rem 0; border-bottom: 1px dashed var(--line); font-size: .86rem; }
.adj { border: 1px solid var(--line); border-radius: var(--r); padding: .6rem .7rem; margin-bottom: .5rem; background: var(--surface); display: flex; flex-direction: column; gap: .3rem; }
.adj-off { opacity: .55; } .adj-h { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; } .adj-lines { display: flex; flex-wrap: wrap; gap: .3rem; } .adj-eff { font-size: .84rem; }
